services:
    ttt-front:
        user: "${UID:-1000}:${GID:-1000}"
        build:
            context: .
            dockerfile: .docker/Dockerfile
            target: ${APP_ENV:-dev}
        container_name: ttt-front
        environment:
            APP_ENV: ${APP_ENV:-dev}
            HOST: 0.0.0.0
            PORT: 3000
            DOMAIN: ${DOMAIN}
        env_file:
          - .env  # charge les variables Nuxt depuis .env
        volumes:
            - "./:/var/www/html"
            - "./traefik/config/traefik.${APP_ENV:-dev}.yml:/etc/traefik/traefik.yml:ro"
            - "/var/www/html/node_modules"
        networks:
            - web
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.ttt-front.rule=Host(`${DOMAIN:-localhost}`)"
            - "traefik.http.services.ttt-front.loadbalancer.server.port=3000"
        extra_hosts:
            - "the-tip-top.front.dev.local:127.0.0.1"

networks:
    web:
        external: true
    mysql_network:
        external: true
